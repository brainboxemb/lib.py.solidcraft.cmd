name: SCPC qualification and API Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  unit:
    name: Python API + local protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SCPC
        run: python -m pip install -e .
      - name: Unit and fake-control-endpoint tests (no GUI)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Example compiles to native JSON
        run: |
          python -m scpc examples/plate/model.py --out output/plate.json
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("output/plate.json").read_text())
          assert len(d["commands"]) == 12
          assert d["commands"][-1]["command"] == "solid.hole"
          PY

  native:
    name: Real SolidCraft 0.30.1 CLI smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOLIDCRAFT_VERSION: "0.30.1"
      SOLIDCRAFT_GPU: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SCPC
        run: python -m pip install -e .
      - name: Download official verified SolidCraft binary
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          BASE="https://github.com/tangency-labs/solidcraft/releases/download/v${SOLIDCRAFT_VERSION}"
          ARCHIVE="solidcraft-${SOLIDCRAFT_VERSION}-linux-x86_64.tar.gz"
          curl --fail --location --retry 3 --silent --show-error "$BASE/SHA256SUMS.txt" --output SHA256SUMS.txt
          curl --fail --location --retry 3 --silent --show-error "$BASE/$ARCHIVE" --output "$ARCHIVE"
          grep -F " $ARCHIVE" SHA256SUMS.txt | sha256sum --check
          tar -xzf "$ARCHIVE"
          echo "$RUNNER_TEMP/solidcraft-${SOLIDCRAFT_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Execute two SCPC Python models in REAL native SolidCraft
        shell: bash
        run: |
          set -euo pipefail
          solidcraft-cli --version
          python tests/native_smoke.py --output-dir output/native-smoke
      - name: Render native examples and attest exact source revision
        shell: bash
        run: |
          set -euo pipefail
          for model in plate corner-bracket; do
            solidcraft-cli snapshot "output/native-smoke/$model/model.sc" \
              --out "output/native-smoke/$model/preview.png" --no-grid --no-axes
            test -s "output/native-smoke/$model/preview.png"
          done
          jq -n --arg source "$GITHUB_SHA" \
            '{source_commit:$source,solidcraft_version:"0.30.1",verified:true}' \
            > output/native-smoke/verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scpc-native-smoke
          path: output/native-smoke/
          if-no-files-found: warn

  windows:
    name: Windows PowerShell test entrypoint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SCPC
        shell: pwsh
        run: python -m pip install -e .
      - name: Test documented Windows command
        shell: pwsh
        run: .\scripts\test.ps1

  pages:
    name: Build, check and publish library Pages
    runs-on: ubuntu-latest
    needs: [unit, native, windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SCPC and documentation renderer
        run: |
          python -m pip install -e .
          python -m pip install -r site/requirements.txt
      - name: Download source-matched real native SolidCraft evidence
        uses: actions/download-artifact@v4
        with:
          name: scpc-native-smoke
          path: output/native-smoke
      - name: Generate and validate static Pages site
        shell: bash
        run: |
          set -euo pipefail
          python site/build.py --out output/site --source-sha "$GITHUB_SHA" --native output/native-smoke
          python site/test_site.py output/site "$GITHUB_SHA"
      - name: Upload browsable SCPC site artifact
        uses: actions/upload-artifact@v4
        with:
          name: scpc-library-pages
          path: output/site/
          if-no-files-found: error
      - name: Publish to gh-pages after all tests pass
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./output/site
          keep_files: false
          commit_message: "Native-verified SCPC Pages at ${{ github.sha }}"
