name: SCPC Python and native SolidCraft qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  unit:
    name: Python API + local protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SCPC
        run: python -m pip install -e .
      - name: Unit and fake-control-endpoint tests (no GUI)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Example compiles to native JSON
        run: |
          python -m scpc examples/plate/model.py --out output/plate.json
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("output/plate.json").read_text())
          assert len(d["commands"]) == 12
          assert d["commands"][-1]["command"] == "solid.hole"
          PY

  native:
    name: Real SolidCraft 0.30.1 CLI smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOLIDCRAFT_VERSION: "0.30.1"
      SOLIDCRAFT_GPU: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SCPC
        run: python -m pip install -e .
      - name: Download official verified SolidCraft binary
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          BASE="https://github.com/tangency-labs/solidcraft/releases/download/v${SOLIDCRAFT_VERSION}"
          ARCHIVE="solidcraft-${SOLIDCRAFT_VERSION}-linux-x86_64.tar.gz"
          curl --fail --location --retry 3 --silent --show-error "$BASE/SHA256SUMS.txt" --output SHA256SUMS.txt
          curl --fail --location --retry 3 --silent --show-error "$BASE/$ARCHIVE" --output "$ARCHIVE"
          grep -F " $ARCHIVE" SHA256SUMS.txt | sha256sum --check
          tar -xzf "$ARCHIVE"
          echo "$RUNNER_TEMP/solidcraft-${SOLIDCRAFT_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Execute Python SCPC Plate in the REAL native engine
        shell: bash
        run: |
          set -euo pipefail
          solidcraft-cli --version
          python tests/native_smoke.py --output-dir output/native-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scpc-native-smoke
          path: output/native-smoke/
          if-no-files-found: warn

  windows:
    name: Windows PowerShell test entrypoint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SCPC
        shell: pwsh
        run: python -m pip install -e .
      - name: Test documented Windows command
        shell: pwsh
        run: .\scripts\test.ps1

  pages:
    name: Build and publish SCPC GitHub Pages
    needs: [unit, native, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SCPC for site generation
        run: python -m pip install -e .
      - name: Build and validate documentation
        shell: bash
        run: |
          set -euo pipefail
          python site/build.py --out output/site --source-sha "$GITHUB_SHA"
          python site/test_site.py output/site "$GITHUB_SHA"
      - name: Save site preview
        uses: actions/upload-artifact@v4
        with:
          name: scpc-pages-preview
          path: output/site
          if-no-files-found: error
          include-hidden-files: true
      - name: Publish to own gh-pages branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./output/site
          keep_files: false
          enable_jekyll: false
          commit_message: "Verified SCPC Pages for ${{ github.sha }}"
