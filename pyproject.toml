[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scpc"
version = "0.1.0"
description = "Thin Python interface for native SolidCraft command scripts"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
scpc = "scpc.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["scpc*"]
